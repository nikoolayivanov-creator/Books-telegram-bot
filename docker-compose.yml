services:
  book-search-bot:
    build: .
    container_name: book-search-bot
    restart: always
    env_file: .env
    volumes:
      - ./data:/data
      - ./logs:/logs
    tmpfs:
      - /tmp/book-search-downloads:size=200M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
